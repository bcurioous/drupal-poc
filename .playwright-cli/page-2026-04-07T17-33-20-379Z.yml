          - generic [ref=e96]:
            - heading "Types of Breast Cancer" [level=1] [ref=e97]
            - generic [ref=e98]:
              - generic "Print this page" [ref=e99] [cursor=pointer]: ⎙
              - generic "Email this page" [ref=e100] [cursor=pointer]: ✉
          - article [ref=e101]:
            - generic [ref=e102]:
              - generic [ref=e103]:
                - img "Doctor consulting with patient" [ref=e105]
                - paragraph [ref=e106]: Talk to your doctor to find out what type of breast cancer you have and how it is used to plan the best treatment for you.
                - paragraph [ref=e107]: "Credit: iStock"
              - generic [ref=e108]:
                - paragraph [ref=e109]: There are many types of breast cancer. The types differ based on several factors, such as which cells in the breast become cancer, whether the cancer has spread from where it first formed, and whether the cancer has certain features that affect treatment options.
                - paragraph [ref=e110]:
                  - strong [ref=e111]:
                    - link "Invasive or infiltrating ductal carcinoma" [ref=e112] [cursor=pointer]:
                      - /url: "#"
                  - text: begins in the cells that line the
                  - link "milk ducts" [ref=e113] [cursor=pointer]:
                    - /url: "#"
                  - text: and has spread beyond where it first formed. It is the most common breast cancer diagnosis. Learn more about
                  - link "Breast Cancer" [ref=e114] [cursor=pointer]:
                    - /url: "#"
                  - text: .
                - paragraph [ref=e115]:
                  - strong [ref=e116]: Invasive lobular carcinoma
                  - text: begins in the cells that line the breast glands that make milk, called lobules, and has spread beyond where it first formed. It grows more slowly and is less common than invasive ductal carcinoma. Lobular carcinoma is more often found in both breasts than are other types of breast cancer.
                - paragraph [ref=e117]:
                  - strong [ref=e118]:
                    - link "Inflammatory breast cancer" [ref=e119] [cursor=pointer]:
                      - /url: "#"
                  - text: is a rare form of breast cancer in which cancer cells block
                  - link "lymph vessels" [ref=e120] [cursor=pointer]:
                    - /url: "#"
                  - text: in the skin of the breast. This type of breast cancer has a high risk of recurrence. It is called inflammatory because the affected breast often looks swollen and red, or inflamed.
                - paragraph [ref=e121]:
                  - strong [ref=e122]:
                    - link "Triple-negative breast cancer" [ref=e123] [cursor=pointer]:
                      - /url: "#"
                  - text: is a form of breast cancer in which the cancer cells lack features that are common in breast cancer, including
                  - link "hormone receptors" [ref=e124] [cursor=pointer]:
                    - /url: "#"
                  - text: and a protein called
                  - link "human epidermal growth factor receptor 2" [ref=e125] [cursor=pointer]:
                    - /url: "#"
                  - text: (HER2). This form of breast cancer has a higher risk of recurrence than most other forms of breast cancer.
                - paragraph [ref=e126]:
                  - strong [ref=e127]:
                    - link "Metastatic breast cancer" [ref=e128] [cursor=pointer]:
                      - /url: "#"
                  - text: ", also called stage 4 breast cancer, is breast cancer that has spread from the breast to another part of the body. Metastatic spread occurs when breast cancer cells break away from the original tumor and travel through the"
                  - link "lymph system" [ref=e129] [cursor=pointer]:
                    - /url: "#"
                  - text: or blood to other sites in the body.
                - paragraph [ref=e130]:
                  - strong [ref=e131]:
                    - link "Ductal carcinoma in situ (DCIS)" [ref=e132] [cursor=pointer]:
                      - /url: "#"
                  - text: forms in the cells that line the milk ducts but has not spread beyond where it first formed. DCIS is not breast cancer but increases the risk of developing breast cancer in the future. Learn more at
                  - link "Benign and Precancerous Breast Lumps and Conditions" [ref=e133] [cursor=pointer]:
                    - /url: "#"
                  - text: .
                - paragraph [ref=e134]:
                  - strong [ref=e135]: Lobular carcinoma in situ (LCIS)
                  - text: forms in the cells that line the breast glands that make milk, called lobules, but has not spread beyond where it first formed. LCIS is not breast cancer but increases the risk of developing breast cancer in the future. Learn more at
                  - link "Benign and Precancerous Breast Lumps and Conditions" [ref=e136] [cursor=pointer]:
                    - /url: "#"
                  - text: .
                - heading "Molecular subtypes of breast cancer" [level=2] [ref=e137]
                - paragraph [ref=e138]:
                  - text: Molecular subtypes of breast cancer are defined by whether they have hormone receptors, HER2 protein, or other
                  - link "biomarkers" [ref=e139] [cursor=pointer]:
                    - /url: "#"
                  - text: . Examples of molecular subtypes of breast cancer include triple-negative, luminal A, luminal B, and HER2-positive. Learn about how these subtypes are diagnosed and how they affect treatment at
                  - link "Tests for Breast Cancer Biomarkers" [ref=e140] [cursor=pointer]:
                    - /url: "#"
                  - text: and
                  - link "Breast Cancer Treatment by Stage" [ref=e141] [cursor=pointer]:
                    - /url: "#"
                  - text: .
                - separator [ref=e142]
                - paragraph [ref=e143]:
                  - text: If you would like to reproduce some or all of this content, see
                  - link "Reuse of NCI Information" [ref=e144] [cursor=pointer]:
                    - /url: "#"
                  - text: for guidance about copyright and permissions. In the case of permitted digital reproduction, please credit the National Cancer Institute as the source and link to the original NCI product using the original product's title; e.g., "Types of Breast Cancer was originally published by the National Cancer Institute."
